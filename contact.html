<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | 株式会社C.R.L</title>
<meta name="description" content="株式会社C.R.Lへのお問い合わせはこちらのフォームからご連絡ください。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo"><img src="images/logo.png" class="logo-full" alt="株式会社C.R.L"></a>
    <nav class="main-nav">
      <button class="nav-toggle" aria-label="メニューを開く" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-list">
        <li><a href="business.html">事業内容</a></li>
        <li><a href="about.html">会社概要</a></li>
        <li><a href="works.html">導入事例</a></li>
        <li><a href="recruit.html">採用情報</a></li>
        <li><a href="contact.html" class="nav-cta is-current">お問い合わせ</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>

  <section class="page-hero page-hero-water">
    <div class="page-hero-inner">
      <p class="page-hero-eyebrow">CONTACT</p>
      <h1>お問い合わせ</h1>
      <p>ご質問・ご相談はこちらのフォームからお気軽にお問い合わせください。</p>
    </div>
    <div class="wave-divider">
      <svg viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,64 C240,120 480,0 720,48 C960,96 1200,32 1440,64 L1440,120 L0,120 Z"/></svg>
    </div>
  </section>

  <section class="section">
    <div class="section-inner">
      <form class="contact-form" id="contact-form">
        <div class="form-row">
          <label for="name">お名前 <span class="required">必須</span></label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-row">
          <label for="furigana">ふりがな</label>
          <input type="text" id="furigana" name="furigana">
        </div>
        <div class="form-row">
          <label for="address">住所 <span class="required">必須</span></label>
          <input type="text" id="address" name="address" required>
        </div>
        <div class="form-row">
          <label for="company">会社名</label>
          <input type="text" id="company" name="company">
        </div>
        <div class="form-row">
          <label for="tel">電話番号 <span class="required">必須</span></label>
          <input type="tel" id="tel" name="tel" required>
        </div>
        <div class="form-row">
          <label for="email">メールアドレス <span class="required">必須</span></label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-row">
          <label for="message">お問い合わせ内容</label>
          <textarea id="message" name="message" rows="6"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">送信する</button>
        <p class="form-note" id="form-note"></p>
      </form>
    </div>
  </section>

  <section class="section section-alt">
    <div class="section-inner">
      <h2 class="section-title">アクセス</h2>
      <div class="access-grid">
        <table class="info-table">
          <tr>
            <th>所在地</th>
            <td>東京都中央区銀座1丁目12-4<br>N&amp;Eビルディング7階</td>
          </tr>
        </table>
        <div class="map-embed">
          <iframe
            src="https://maps.google.com/maps?q=%E6%9D%B1%E4%BA%AC%E9%83%BD%E4%B8%AD%E5%A4%AE%E5%8C%BA%E9%8A%80%E5%BA%A71%E4%B8%81%E7%9B%AE12-4&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="株式会社C.R.L 所在地地図">
          </iframe>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-col footer-brand">
      <p class="footer-logo"><img src="images/logo.png" class="logo-full logo-full-footer" alt="株式会社C.R.L"></p>
      <p class="footer-address">東京都中央区銀座1丁目12-4<br>N&amp;Eビルディング7階</p>
    </div>
    <div class="footer-col">
      <p class="footer-heading">サイトメニュー</p>
      <ul class="footer-nav">
        <li><a href="business.html">事業内容</a></li>
        <li><a href="about.html">会社概要</a></li>
        <li><a href="works.html">導入事例</a></li>
        <li><a href="recruit.html">採用情報</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>
    </div>
  </div>
  <div class="footer-bottom">
    <p>&copy; 2026 株式会社C.R.L</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
